<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login | AI Study Assistant
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <nav>

            <div class="logo">
                🤖 AI Study Assistant
            </div>

            <div class="nav-links">

                <a href="index.html">
                    Home
                </a>

            </div>

        </nav>

    </header>


    <!-- =========================
         LOGIN PAGE
    ========================== -->

    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-icon">
                🤖
            </div>

            <p class="tagline">
                Welcome Back
            </p>

            <h1>
                Login to Your Account
            </h1>

            <p class="auth-description">
                Continue your learning journey
                with AI Study Assistant.
            </p>


            <!-- LOGIN FORM -->

            <form id="loginForm">

                <div class="auth-field">

                    <label for="loginEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="auth-field">

                    <label for="loginPassword">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                        >
                            👁️
                        </button>

                    </div>

                </div>


                <p
                    id="loginMessage"
                    class="auth-message"
                ></p>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Login 🚀
                </button>

            </form>


            <div class="auth-divider">
                <span>OR</span>
            </div>


            <p class="auth-switch">

                Don't have an account?

                <a href="signup.html">
                    Create Account
                </a>

            </p>


        </div>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            © 2026 AI Study Assistant |
            Learn Smarter 🚀
        </p>

    </footer>


    <script src="login.js"></script>

</body>

</html>
