<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Create Account | AI Study Assistant
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <nav>

            <div class="logo">
                🤖 AI Study Assistant
            </div>

            <div class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="login.html">
                    Login
                </a>

            </div>

        </nav>

    </header>


    <!-- =========================
         SIGNUP PAGE
    ========================== -->

    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-icon">
                🎓
            </div>

            <p class="tagline">
                Start Your Journey
            </p>

            <h1>
                Create Your Account
            </h1>

            <p class="auth-description">
                Create your account and start
                learning smarter with AI.
            </p>


            <!-- SIGNUP FORM -->

            <form id="signupForm">


                <!-- NAME -->

                <div class="auth-field">

                    <label for="signupName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="signupName"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="auth-field">

                    <label for="signupEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="auth-field">

                    <label for="signupPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="auth-field">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <p
                    id="signupMessage"
                    class="auth-message"
                ></p>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Create Account 🚀
                </button>

            </form>


            <div class="auth-divider">
                <span>OR</span>
            </div>


            <p class="auth-switch">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


        </div>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            © 2026 AI Study Assistant |
            Learn Smarter 🚀
        </p>

    </footer>


    <script src="signup.js"></script>

</body>

</html>
